[project]
name = "dynasty-command-quant"
version = "0.1.0"
description = "Market Arbitrage Score engine for DYNASTY COMMAND — Sleeper-integrated Python analytics module."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
